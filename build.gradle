import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

// CI passes -Pbuild_number=<run number>, which is appended to the mod version (0.1.5+build.42); local builds are plain.
version = project.findProperty('build_number') ? "${mod_version}+build.${project.property('build_number')}" : mod_version
group = mod_group_id

repositories {
    maven {
        // JEI API (optional integration, compile only).
        url "https://maven.blamejared.com"
        content { includeGroup("mezz.jei") }
    }
    maven {
        url "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }
}

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // JUnit tests for the parts that don't need a running game (src/test/java).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Cobalt, the pure-Java Lua 5.2 VM (MIT), is repackaged into dev.computah.repack and shipped inside our jar. Saving
// running computers reads Cobalt's internals, so we must always run with exactly this version, and never with the
// copy another mod (CC: Tweaked) brings along.
configurations {
    cobalt
}

var relocateCobalt = tasks.register('relocateCobalt', ShadowJar) {
    configurations = [project.configurations.cobalt]
    archiveBaseName = 'cobalt-relocated'
    archiveVersion = cobalt_version
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('relocated')
    relocate 'org.squiddev.cobalt', 'dev.computah.repack.cobalt'
    relocate 'cc.tweaked.cobalt', 'dev.computah.repack.cobaltinternal'
    exclude 'module-info.class', 'META-INF/maven/**', 'META-INF/*.MF'
}
var relocatedCobalt = files(relocateCobalt.flatMap { it.archiveFile }).builtBy(relocateCobalt)

dependencies {
    cobalt "cc.tweaked:cobalt:${cobalt_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    implementation relocatedCobalt
    additionalRuntimeClasspath relocatedCobalt

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Test-only code and structures are not shipped.
tasks.named('jar') {
    exclude 'dev/computah/test/**'
    exclude 'data/computah/structure/**'
    from(relocateCobalt.flatMap { it.archiveFile }.map { zipTree(it) }) {
        exclude 'META-INF/**'
    }
    from('CREDITS.md')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
